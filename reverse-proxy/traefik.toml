# Traefik v3 static configuration (optional — enable with: docker compose --profile proxy up -d)

[log]
  level = "INFO"

[api]
  dashboard = true
  insecure = true

[entryPoints]
  [entryPoints.web]
    address = ":80"
    [entryPoints.web.http.redirections.entryPoint]
      to = "websecure"
      scheme = "https"

  [entryPoints.websecure]
    address = ":443"

[providers.docker]
  endpoint = "unix:///var/run/docker.sock"
  exposedByDefault = false
  network = "apps"

# Place your TLS certificate and key under reverse-proxy/certs/
# and point these paths to the filenames inside the container.
[tls.stores]
  [tls.stores.default]
    [tls.stores.default.defaultCertificate]
      certFile = "/etc/certs/cert.pem"
      keyFile = "/etc/certs/key.pem"
